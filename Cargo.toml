[workspace]
members = [
  "crates/kamacite-core",
  "crates/kamacite-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/OnixResearch/kamacite"
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1.8.2"
nickel-export-core = { git = "https://github.com/OnixResearch/nickel-export", rev = "710b6e03a8faf74f6afc6cc8ef36d7667958b70d" }
preserves = { version = "5.0.0-rc.7", features = ["serde"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
steel = { package = "steel-core", version = "=0.8.2" }
